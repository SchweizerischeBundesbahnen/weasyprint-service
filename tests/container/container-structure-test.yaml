---
schemaVersion: 2.0.0
commandTests:
  - name: Python installation - check uv-installed Python is in venv
    command: which
    args: [python]
    expectedOutput: [/opt/weasyprint/.venv/bin/python]
  - name: Python version is correct
    command: python
    args: [--version]
    expectedOutput: [Python 3.15.*]
  - name: uv version is correct
    command: uv
    args: [--version]
    expectedOutput: [uv 0.*.*]
  - name: Weasyprint version is correct
    command: weasyprint
    args: [--version]
    expectedOutput: [70.0]
  - name: Tox should not be installed
    command: uv
    args: [run, --no-sync, tox, --version]
    exitCode: 2
  - name: Pytest should not be installed
    command: uv
    args: [run, --no-sync, pytest, --version]
    exitCode: 2
  - name: Ruff should not be installed
    command: uv
    args: [run, --no-sync, ruff, --version]
    exitCode: 2
  - name: ty should not be installed
    command: uv
    args: [run, --no-sync, ty, --version]
    exitCode: 2
  - name: Pre-commit should not be installed
    command: uv
    args: [run, --no-sync, pre-commit, --version]
    exitCode: 2
  # The healthcheck probes with Python, curl would be in the image for it alone
  - name: Curl should not be installed
    command: sh
    args: [-c, '! command -v curl']
    exitCode: 0
  # weasysvg draws SVG, the service starts no browser
  - name: Playwright and its Chromium should not be installed
    command: sh
    args: [-c, '! test -e /opt/playwright && ! python -c "import playwright" 2>/dev/null && test -z "$(find / -xdev \( -name chrome-headless-shell -o -name chromium -o -name chrome \) -print -quit 2>/dev/null)"']
    exitCode: 0
  # The service draws nothing on a screen, an X server has no use in it
  - name: Xvfb should not be installed
    command: sh
    args: [-c, '! command -v Xvfb']
    exitCode: 0
  # Every package installs from a wheel, the image needs no compiler
  - name: A C compiler should not be installed
    command: sh
    args: [-c, '! command -v gcc && ! command -v cc']
    exitCode: 0
  - name: Log directory exists
    command: test
    args: [-d, /opt/weasyprint/logs]
    exitCode: 0
  - name: Log directory is writable
    command: touch
    args: [/opt/weasyprint/logs/test.log]
    exitCode: 0
  - name: Python logging module is available
    command: python
    args: [-c, import logging; logging.basicConfig(); logging.info('test')]
    exitCode: 0
  - name: uv-installed Python directory exists
    command: test
    args: [-d, /opt/python]
    exitCode: 0
  # The base Python, not the venv: the venv has no pip of its own either way
  - name: The uv-installed Python has no pip
    command: python
    args: [-c, 'import subprocess, sys; sys.exit(subprocess.run([sys.base_prefix + "/bin/python3", "-I", "-c", "import pip"]).returncode == 0)']
    exitCode: 0
  - name: libvisio is 0.1.7 of trixie, which weasyvsdx is tested with
    command: vsd2xhtml
    args: [--version]
    expectedOutput: [vsd2xhtml 0\.1\.7]
  - name: emf2svg draws the EMF images of Visio drawings
    command: sh
    args: [-c, command -v emf2svg-conv]
    exitCode: 0
  - name: The replacements of the fonts of Visio drawings are installed
    command: sh
    args: [-c, 'fc-list Selawik | grep -q . && fc-list Carlito | grep -q . && fc-list Caladea | grep -q .']
    exitCode: 0
  - name: The license of Selawik travels with it
    command: sh
    args: [-c, 'grep -q "SIL OPEN FONT LICENSE" /usr/local/share/fonts/selawik/LICENSE.txt']
    exitCode: 0
  # The slim image drops the documentation of packages, but keeps their copyright files
  - name: Every font package keeps its license
    command: sh
    args: [-c, 'for package in $(dpkg-query --show --showformat="\${Package}\n" "fonts-*"); do test -s "/usr/share/doc/$package/copyright" || { echo "$package has no copyright file"; exit 1; }; done']
    exitCode: 0
  - name: Symbola draws the symbols of Word documents
    command: sh
    args: [-c, 'fc-list Symbola | grep -q .']
    exitCode: 0
  # The generic families stay on DejaVu: a document which names no installed font keeps its line breaks
  - name: The generic families are DejaVu
    command: sh
    args: [-c, 'fc-match serif | grep -q "DejaVu Serif" && fc-match sans-serif | grep -q "DejaVu Sans"']
    exitCode: 0
fileExistenceTests:
  - name: Log directory
    path: /opt/weasyprint/logs
    shouldExist: true
    permissions: drwxrwxrwx
    uid: 1000
    gid: 1000
  - name: Dashboard HTML resource
    path: /opt/weasyprint/app/resources/dashboard.html
    shouldExist: true
  - name: Dashboard note.png resource
    path: /opt/weasyprint/app/resources/note.png
    shouldExist: true
  - name: Chart.js library for dashboard
    path: /opt/weasyprint/app/static/chart.umd.min.js
    shouldExist: true
