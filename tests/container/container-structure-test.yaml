---
schemaVersion: 2.0.0
commandTests:
  - name: Python installation - check uv-installed Python is in venv
    command: which
    args: [python]
    expectedOutput: [/opt/weasyprint/.venv/bin/python]
  - name: Python version is correct
    command: python
    args: [--version]
    expectedOutput: [Python 3.14.*]
  - name: uv version is correct
    command: uv
    args: [--version]
    expectedOutput: [uv 0.*.*]
  - name: Weasyprint version is correct
    command: weasyprint
    args: [--version]
    expectedOutput: [70.0]
  - name: Chromium version is correct
    # The browser directory carries the Playwright revision, and its inner directory
    # carries the architecture (chrome-linux64 on amd64, chrome-linux-arm64 on arm64),
    # so both are matched by a glob. The version string differs per build, so only the
    # version number is asserted.
    command: sh
    args: [-c, /opt/playwright/chromium-*/chrome-linux*/chrome --version]
    expectedOutput: [153\.0\.8010\.12]
  - name: Tox should not be installed
    command: uv
    args: [run, --no-sync, tox, --version]
    exitCode: 2
  - name: Pytest should not be installed
    command: uv
    args: [run, --no-sync, pytest, --version]
    exitCode: 2
  - name: Ruff should not be installed
    command: uv
    args: [run, --no-sync, ruff, --version]
    exitCode: 2
  - name: Mypy should not be installed
    command: uv
    args: [run, --no-sync, mypy, --version]
    exitCode: 2
  - name: Pre-commit should not be installed
    command: uv
    args: [run, --no-sync, pre-commit, --version]
    exitCode: 2
  # The healthcheck probes with Python, curl would be in the image for it alone
  - name: Curl should not be installed
    command: sh
    args: [-c, '! command -v curl']
    exitCode: 0
  # Chromium runs headless, playwright install --with-deps would add an X server
  - name: Xvfb should not be installed
    command: sh
    args: [-c, '! command -v Xvfb']
    exitCode: 0
  - name: Log directory exists
    command: test
    args: [-d, /opt/weasyprint/logs]
    exitCode: 0
  - name: Log directory is writable
    command: touch
    args: [/opt/weasyprint/logs/test.log]
    exitCode: 0
  - name: Python logging module is available
    command: python
    args: [-c, import logging; logging.basicConfig(); logging.info('test')]
    exitCode: 0
  - name: uv-installed Python directory exists
    command: test
    args: [-d, /opt/python]
    exitCode: 0
  # The base Python, not the venv: the venv has no pip of its own either way
  - name: The uv-installed Python has no pip
    command: python
    args: [-c, 'import subprocess, sys; sys.exit(subprocess.run([sys.base_prefix + "/bin/python3", "-I", "-c", "import pip"]).returncode == 0)']
    exitCode: 0
fileExistenceTests:
  - name: Log directory
    path: /opt/weasyprint/logs
    shouldExist: true
    permissions: drwxrwxrwx
    uid: 1000
    gid: 1000
  - name: Dashboard HTML resource
    path: /opt/weasyprint/app/resources/dashboard.html
    shouldExist: true
  - name: Dashboard note.png resource
    path: /opt/weasyprint/app/resources/note.png
    shouldExist: true
  - name: Chart.js library for dashboard
    path: /opt/weasyprint/app/static/chart.umd.min.js
    shouldExist: true
